<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN Cracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0f1115;
            color: #e6edf3;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: clamp(16px, 4vw, 36px);
        }
        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin: 0 0 16px 0;
            letter-spacing: 3px;
            color: #58a6ff;
            text-align: center;
        }
        .calculator {
            background: #161b22;
            padding: clamp(18px, 4vw, 28px);
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            width: min(94vw, 480px);
        }
        .controls-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .control-group {
            flex: 1;
            min-width: 130px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .control-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
        }
        select {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 14px;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }
        .attempts-badge {
            color: #58a6ff;
            font-weight: bold;
        }
        .attempts-badge.danger {
            color: #f85149;
        }
        .hints-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-left: 4px solid #d29922;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .hints-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #d29922;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .hints-list {
            margin: 0;
            padding-left: 18px;
            font-size: clamp(0.88rem, 2.4vw, 1rem);
            line-height: 1.5;
            color: #c9d1d9;
        }
        .screen {
            background: #0d1117;
            color: #3fb950;
            font-size: clamp(2rem, 6.5vw, 3rem);
            text-align: center;
            padding: clamp(12px, 3vw, 20px);
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 18px;
            letter-spacing: clamp(6px, 2.5vw, 14px);
            font-weight: bold;
        }
        .screen.locked {
            color: #f85149;
            letter-spacing: 2px;
            font-size: clamp(1.4rem, 4.5vw, 2rem);
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 2.5vw, 14px);
        }
        button {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            padding: clamp(14px, 3.8vw, 22px);
            font-size: clamp(1.3rem, 4vw, 1.65rem);
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.05s ease, background 0.15s ease;
        }
        button:hover:not(:disabled) { background: #30363d; }
        button:active:not(:disabled) { transform: scale(0.96); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-enter { background: #238636; border-color: #2ea043; }
        .btn-enter:hover:not(:disabled) { background: #2ea043; }
        .btn-clear { background: #da3633; border-color: #f85149; }
        .btn-clear:hover:not(:disabled) { background: #f85149; }
        .log {
            margin-top: 22px;
            width: min(94vw, 480px);
            font-size: clamp(0.9rem, 2.4vw, 1rem);
        }
        .log-entry {
            background: #161b22;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #58a6ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tiles {
            display: flex;
            gap: 5px;
        }
        .tile {
            width: 30px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }
        .tile.correct { background: #238636; border: 1px solid #3fb950; }
        .tile.present { background: #9e6a03; border: 1px solid #d29922; }
        .tile.absent  { background: #21262d; border: 1px solid #30363d; color: #8b949e; }
        .win {
            border-left-color: #3fb950;
            background: #12261e;
        }
        .lose {
            border-left-color: #f85149;
            background: #2b1418;
        }
        .reset-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            background: #238636;
            border-color: #2ea043;
        }
    </style>
</head>
<body>

<h1>PIN CRACKER</h1>

<div class="calculator">
    <div class="controls-bar">
        <div class="control-group">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" onchange="resetGame()">
                <option value="easy">Easy (3 Digits)</option>
                <option value="normal" selected>Normal (4 Digits)</option>
                <option value="hard">Hard (5 Digits)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="max-attempts">Attempts</label>
            <select id="max-attempts" onchange="resetGame()">
                <option value="5">5 Tries</option>
                <option value="8" selected>8 Tries</option>
                <option value="10">10 Tries</option>
                <option value="0">Unlimited</option>
            </select>
        </div>
    </div>

    <div class="status-bar">
        <span>Remaining Tries:</span>
        <span class="attempts-badge" id="attempts-display">8 / 8</span>
    </div>

    <div class="hints-box">
        <div class="hints-title">Intercepted Clues</div>
        <ul class="hints-list" id="hints-list">
            {% for hint in hints %}
            <li>{{ hint }}</li>
            {% endfor %}
        </ul>
    </div>

    <div class="screen" id="screen">____</div>

    <div class="keypad" id="keypad">
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="btn-clear" onclick="clearScreen()">C</button>
        <button onclick="press('0')">0</button>
        <button class="btn-enter" onclick="submitGuess()">=</button>
    </div>
</div>

<div class="log" id="log"></div>

<script>
    let current = "";
    let pinLength = {{ length }};
    let maxAttempts = 8;
    let gameOver = false;

    function updateScreen() {
        const screen = document.getElementById("screen");
        screen.classList.remove("locked");
        screen.innerText = current.padEnd(pinLength, "_");
    }

    function updateAttemptsDisplay(used, max) {
        const el = document.getElementById("attempts-display");
        if (max === 0) {
            el.innerText = "Unlimited (Used: " + used + ")";
            el.classList.remove("danger");
        } else {
            const left = Math.max(0, max - used);
            el.innerText = left + " / " + max;
            el.classList.toggle("danger", left <= 2);
        }
    }

    function setKeypadDisabled(disabled) {
        document.querySelectorAll("#keypad button").forEach(function(btn) {
            btn.disabled = disabled;
        });
    }

    function press(num) {
        if (gameOver) return;
        if (current.length < pinLength) {
            current += num;
            updateScreen();
        }
    }

    function clearScreen() {
        if (gameOver) return;
        current = "";
        updateScreen();
    }

    async function submitGuess() {
        if (gameOver || current.length !== pinLength) return;
        const guess = current;
        clearScreen();

        const res = await fetch("/guess", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ guess: guess })
        });
        const data = await res.json();
        if (data.error) return;

        updateAttemptsDisplay(data.attempts, data.max_attempts);
    const tilesHtml = guess.split("").map(function(digit, idx) {
return '' + digit + '';
`}).join("");
const log = document.getElementById("log");
const entry = document.createElement("div");
if (data.won) {
gameOver = true;
setKeypadDisabled(true);
entry.className = "log-entry win";
entry.innerHTML = '' + tilesHtml + 'UNLOCKED in ' + data.attempts + '! New PIN';
} else if (data.lost) {
gameOver = true;
setKeypadDisabled(true);
const screen = document.getElementById("screen");
screen.classList.add("locked");
screen.innerText = "PIN: " + data.secret;
entry.className = "log-entry lose";
entry.innerHTML = '' + tilesHtml + 'LOCKED OUT! Try Again';
} else {
entry.className = "log-entry";
entry.innerHTML = '' + tilesHtml + '' + data.exact + ' exact, ' + data.misplaced + ' misplaced';
}
log.prepend(entry);
}
async function resetGame() {
const difficulty = document.getElementById("difficulty").value;
const maxVal = parseInt(document.getElementById("max-attempts").value, 10);
const res = await fetch("/reset", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ difficulty: difficulty, max_attempts: maxVal })
});
const data = await res.json();
pinLength = data.length;
maxAttempts = data.max_attempts;
gameOver = false;
current = "";
setKeypadDisabled(false);
updateScreen();
updateAttemptsDisplay(0, maxAttempts);
const hintsList = document.getElementById("hints-list");
hintsList.innerHTML = data.hints.map(function(h) {
return "" + h + "";
}).join("");
document.getElementById("log").innerHTML = "";
}
document.addEventListener("keydown", function(e) {
if (gameOver) return;
if (e.key >= "0" && e.key <= "9") press(e.key);
if (e.key === "Backspace") {
current = current.slice(0, -1);
updateScreen();
}
if (e.key === "Escape") clearScreen();
if (e.key === "Enter") submitGuess();
});
